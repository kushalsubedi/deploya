name: Release

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # - name: Install deploya
      #   run: go install github.com/kushalsubedi/deploya@latest
      - name: Build deploya from source
        run: go build -o $HOME/go/bin/deploya .

      - name: Run deploya release
        run: deploya release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release summary
        if: always()
        env:
          RELEASE_STATUS: ${{ job.status }}
        run: |
          echo "## Release Summary — ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | $RELEASE_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container images | Release units with Dockerfiles publish version-tagged images to GHCR. |" >> "$GITHUB_STEP_SUMMARY"
